[project]
name = "openscout"
version = "0.1.0"
description = "A local-first toolkit for web intelligence, data extraction, media processing, and automation."
readme = "README.md"
authors = [
    { name = "Rakibul 👾", email = "rakibulwspace@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "certifi>=2026.10.23",
    "dnspython>=2.9.2",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "requests[socks]>=2.34.2",
    "rich>=15.0.0",
    "selectolax>=1.0.2",
    "trafilatura>=2.3.1",
    "typer>=0.29.1",
]

[project.scripts]
openscout = "openscout:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
